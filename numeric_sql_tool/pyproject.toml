[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numeric-sql-tool"
version = "0.1.0"
description = "Numeric SQL tool for meeting metadata"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.24",
]

[project.scripts]
numeric-sql-tool = "numeric_sql_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
