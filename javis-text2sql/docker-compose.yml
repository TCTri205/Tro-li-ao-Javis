services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: javis_text2sql
      POSTGRES_USER: javis_etl
      POSTGRES_PASSWORD: javis_etl
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javis_etl -d javis_text2sql"]
      interval: 5s
      timeout: 5s
      retries: 10
