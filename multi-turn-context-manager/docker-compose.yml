version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: javis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "54331:5432"
    volumes:
      - javis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  javis_pgdata:
    name: javis_pgdata
